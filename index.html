<html lang="fr">
<head>
<meta charset="utf-8">
<script>try { var t = localStorage.getItem('idest-frais:theme'); if (t) { t = JSON.parse(t); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } } catch (e) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Estimation des frais judiciaires et des dépens : procédure civile (Vaud, Genève, Tribunal fédéral) et recours en marchés publics (Vaud, Genève, TAF, Tribunal fédéral). Court costs and party costs estimator. id est avocats.">
<title>Frais judiciaires et dépens, id est avocats</title>
<style>


:root{
  --rose:#E61E6E; --anthra:#333334; --turq:#069297; --orange:#F7A823; --cream:#FDF1DC; --lrose:#FAE0EB; --lgrey:#F2F2F2;
  --bg:#F2F2F2; --panel:#FFFFFF; --ink:#333334; --muted:#68686C; --line:#DEDDE1; --field:#FFFFFF;
  --date:#C8155C;
  --ok-bg:#E3F3F3; --ok-ink:#05666A; --ok-line:#9ED3D4;
  --warn-bg:#FDF1DC; --warn-ink:#7A4D00; --warn-line:#F7A823;
  --bad-bg:#FAE0EB; --bad-ink:#9E0F47; --bad-line:#E61E6E;
  --info-bg:#F2F2F2; --info-ink:#333334; --info-line:#DEDDE1;
  --nbg:#333334; --legal-bg:#F2F2F2; --caution-bg:#FDF1DC; --caution-ink:#5A3A00; --auto-bg:#E3F3F3;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --head:"Grandview","Grandview Display",Arial,"Helvetica Neue",Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1B1C; --panel:#252526; --ink:#F2F2F2; --muted:#B3B3B8; --line:#3A3A3D; --field:#1F1F20; --date:#FF6FA5;
    --ok-bg:#0F2E2F; --ok-ink:#8ED9DB; --ok-line:#1F5D5F;
    --warn-bg:#352812; --warn-ink:#FFD58A; --warn-line:#8A6418;
    --bad-bg:#3A1424; --bad-ink:#FFA9CA; --bad-line:#8E1F4C;
    --info-bg:#2C2C2E; --info-ink:#E6E6E8; --info-line:#3A3A3D; --nbg:#E61E6E; --legal-bg:#2C2C2E; --caution-bg:#352812; --caution-ink:#FFD58A; --auto-bg:#0F2E2F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1B1C; --panel:#252526; --ink:#F2F2F2; --muted:#B3B3B8; --line:#3A3A3D; --field:#1F1F20; --date:#FF6FA5;
  --ok-bg:#0F2E2F; --ok-ink:#8ED9DB; --ok-line:#1F5D5F;
  --warn-bg:#352812; --warn-ink:#FFD58A; --warn-line:#8A6418;
  --bad-bg:#3A1424; --bad-ink:#FFA9CA; --bad-line:#8E1F4C;
  --info-bg:#2C2C2E; --info-ink:#E6E6E8; --info-line:#3A3A3D; --nbg:#E61E6E; --legal-bg:#2C2C2E; --caution-bg:#352812; --caution-ink:#FFD58A; --auto-bg:#0F2E2F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%}
.topband{height:6px;background:var(--rose)}
.wrap{max-width:1140px;margin:0 auto;padding:26px 20px 40px}
header{position:relative;padding-right:28px}
header::after{content:"";position:absolute;right:0;top:4px;width:6px;height:64px;background:var(--orange)}
.firm{font-weight:700;color:var(--rose);font-size:14px;letter-spacing:.01em}
h1{font-family:var(--head);font-size:34px;line-height:1.12;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
header p{margin:8px 0 0;color:var(--muted);max-width:72ch}
.caution{margin-top:16px;background:var(--caution-bg);color:var(--caution-ink);border-left:5px solid var(--orange);border-radius:6px;padding:11px 14px;font-size:14.5px;max-width:84ch}
.caution b{font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:22px;margin-top:22px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--rose);border-radius:8px;padding:20px}
.result{position:sticky;top:16px;border-top-color:var(--turq)}
@media (max-width:920px){.result{position:static}}
fieldset{border:0;margin:0 0 20px;padding:0}
fieldset:last-of-type{margin-bottom:0}
legend{font-family:var(--head);font-weight:700;font-size:17px;margin-bottom:8px;padding:0;display:flex;gap:10px;align-items:center}
legend .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--nbg);color:#fff;font-size:13px;font-family:var(--font)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
select,input[type=date],input[type=number]{width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px 11px;min-height:44px}
select:focus,input:focus,button:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--rose) 40%,transparent);outline-offset:1px;border-color:var(--rose)}
.row{display:grid;grid-template-columns:1fr 140px;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.radios{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.radios label,.check{display:flex;gap:9px;align-items:flex-start;font-weight:400;margin:0;font-size:14.5px;cursor:pointer}
.radios input,.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--rose);flex:none}
.check{margin-top:10px}
.sub{margin-left:27px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0 2px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.legal{margin-top:10px;font-size:13.5px;color:var(--muted);background:var(--legal-bg);border-radius:6px;padding:9px 11px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.legal.ok{background:var(--ok-bg);color:var(--ok-ink)} .legal.warn{background:var(--warn-bg);color:var(--warn-ink)}
input.auto{background:var(--auto-bg);font-weight:700}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.theme button{font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);background:transparent;border:0;padding:5px 11px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--anthra);color:#fff}
.beta{display:inline-block;vertical-align:middle;margin-left:10px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--rose);border:1.5px solid var(--rose);border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.legal b{color:var(--ink)}
.linkish{font:inherit;font-size:13.5px;font-weight:700;color:var(--rose);background:none;border:0;padding:3px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

.r-label{font-size:14px;color:var(--muted);font-weight:700}
.date{font-family:var(--head);font-size:clamp(26px,4vw,38px);line-height:1.12;font-weight:700;color:var(--date);margin:4px 0 8px}
.date.empty{color:var(--muted);font-weight:400;font-size:19px;font-family:var(--font)}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)} .chip.soon{background:var(--warn-bg);color:var(--warn-ink)} .chip.late{background:var(--bad-bg);color:var(--bad-ink)}
.alerts{display:flex;flex-direction:column;gap:8px;margin:14px 0 0}
.alert{border-radius:6px;padding:10px 12px;font-size:14.5px;border:1px solid;border-left-width:5px}
.alert.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line);border-left-color:var(--turq)}
.alert.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.alert.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
.alert.info{background:var(--info-bg);color:var(--info-ink);border-color:var(--info-line)}
.alert b{font-weight:700}
.alert .linkish{color:inherit;padding:0;margin-left:4px}
.tl{margin-top:18px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.bar .c{background:var(--turq)}
.bar .s{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 6px);opacity:.6}
.bar .x{background:var(--orange)}
.tl-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px}
.legendrow{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
h2{font-family:var(--head);font-size:16.5px;margin:20px 0 6px}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin:5px 0;font-size:14.5px}
.ref{color:var(--muted);font-size:13px}
ul.rules{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
ul.rules li{margin:4px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;font-weight:700;font-size:14.5px;border-radius:6px;padding:10px 16px;cursor:pointer;border:1px solid var(--rose);background:var(--rose);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
footer{margin-top:30px;color:var(--muted);font-size:13px}
footer .inner{max-width:92ch}
footer p{margin:6px 0}
details{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
details p{color:var(--ink);font-size:13.5px}
footer a{color:var(--rose)}
.bottomband{background:var(--rose);color:#fff;font-size:13px;margin-top:26px}
.bottomband .wrap{padding-top:12px;padding-bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){h1{font-size:28px}.row{grid-template-columns:1fr 112px}.panel{padding:16px}header::after{height:48px}}
@media print{.topband,.bottomband,.caution,form,.actions,details{display:none!important}.grid{display:block}.panel{border:0}body{background:#fff}}

.cards{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-left:4px solid var(--turq);border-radius:6px;padding:12px 12px 10px;background:var(--field)}
.card.pay{border-left-color:var(--orange)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px}
.card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .grid3{display:grid;grid-template-columns:1.3fr 1fr 0.7fr;gap:8px}
.card label{margin:8px 0 4px;font-size:13px}
.card input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:42px}
.card select,.card input[type=date],.card input[type=number]{background:var(--panel);min-height:42px;padding:9px 10px;font-size:15px}
.del{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.add{font:inherit;font-weight:700;font-size:14px;border-radius:6px;padding:9px 14px;cursor:pointer;border:1px dashed var(--rose);background:transparent;color:var(--rose);margin-top:10px}
.total{font-family:var(--head);font-size:clamp(26px,4vw,36px);line-height:1.12;font-weight:700;color:var(--date);margin:4px 0 6px}
.total.empty{color:var(--muted);font-weight:400;font-size:19px;font-family:var(--font)}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--legal-bg);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--muted)}
.kpi b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin-top:8px}
table.dc{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.dc th,table.dc td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dc th:first-child,table.dc td:first-child{text-align:left;white-space:normal}
table.dc th{font-size:12.5px;color:var(--muted);font-weight:700}
table.dc tr.sum td{font-weight:700;border-bottom:2px solid var(--ink)}
table.dc tr.cr td{background:var(--legal-bg);font-weight:700}
.copyblock{margin-top:12px}
.copyblock .cb-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.copyblock h3{font-family:var(--head);font-size:15px;margin:0}
.copyblock textarea{width:100%;min-height:96px;margin-top:6px;font:13.5px/1.45 var(--font);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.btn.small{padding:6px 12px;font-size:13px}
.f-rate.is-default{color:var(--muted);background:var(--legal-bg);font-style:italic}
.deflabel{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:4px}
details.mini{margin-top:12px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
details.mini summary{font-size:13.5px}
details.mini p,details.mini li{font-size:12.5px;color:var(--muted);line-height:1.45}
details.mini ul{margin:6px 0 0;padding-left:18px}
@media (max-width:520px){.card .grid3{grid-template-columns:1fr 1fr}.card .grid3 > :first-child{grid-column:1 / -1}}

.note-lang{font-size:12.5px;color:var(--muted);margin-top:4px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.range{font-size:14px;color:var(--muted);margin-bottom:8px}
.kpi small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.excl{font-size:12.5px;color:var(--muted);margin-top:8px}
table.dc td.ref{white-space:normal;text-align:left;color:var(--muted);font-size:12.5px;min-width:180px}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 10px}
.outcomes .oc:only-child,.outcomes .oc.fail:has(+ .oc[hidden]){grid-column:1 / -1}
@media (max-width:1100px){.outcomes{grid-template-columns:1fr}}
.oc{border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;background:var(--panel)}
.oc.fail{border-top:4px solid var(--rose)}
.oc.win{border-top:4px solid var(--turq)}
.oc .total{font-size:clamp(24px,3vw,30px);margin:2px 0 2px}
.oc.win .total{color:var(--turq)}
.oc .range{font-size:12.5px;margin-bottom:4px}
.oclines{list-style:none;padding:0;margin:4px 0 0;font-size:12.5px}
.oclines li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--line)}
.oclines li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.oclines li.tot{font-weight:700;border-bottom:0}
.oclines li.info{color:var(--muted);font-style:italic}
.ocnote{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}
#pathTable{font-size:12.5px}
#pathTable td,#pathTable th{padding-left:6px;padding-right:6px}
.pathpanel{border-left:3px solid var(--turq);padding:2px 0 4px 12px;margin:4px 0 10px}
.pathpanel .sub{margin:0 0 6px 26px}
table.dc tr.main td{font-weight:700}
</style>
</head>
<body>
<div class="topband" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="headrow">
      <div class="firm">id est avocats</div>
      <div class="toggles">
        <div class="theme" role="group" data-i18n-aria="langGroup" aria-label="Langue">
          <button type="button" data-lang-set="fr" lang="fr">FR</button><button type="button" data-lang-set="en" lang="en">EN</button>
        </div>
        <div class="theme" role="group" data-i18n-aria="themeGroup" aria-label="Affichage">
          <button type="button" data-theme-set="auto" data-i18n="themeAuto">Auto</button><button type="button" data-theme-set="light" data-i18n="themeLight">Clair</button><button type="button" data-theme-set="dark" data-i18n="themeDark">Sombre</button>
        </div>
      </div>
    </div>
    <h1><span data-i18n="title">Frais judiciaires et dépens</span><span class="beta">beta</span></h1>
    <p data-i18n="subtitle"></p>
    <div class="caution" role="note" data-i18n-html="caution"></div>
  </header>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend><span class="n">1</span><span data-i18n="lgProc"></span></legend>
        <label for="domain" data-i18n="lbDomain"></label>
        <select id="domain"><option value="civil" data-i18n="dCivil"></option><option value="mp" data-i18n="dMP"></option></select>
        <div id="mpBox" hidden>
          <label for="auth" data-i18n="lbAuth"></label>
          <select id="auth">
            <option value="vd" data-i18n="aVD"></option>
            <option value="ge" data-i18n="aGE"></option>
            <option value="taf" data-i18n="aTAF"></option>
            <option value="tf" data-i18n="aTF"></option>
          </select>
        </div>
        <div id="civilBox">
          <div id="cantonBox">
            <label for="canton" data-i18n="lbCanton"></label>
            <select id="canton"><option value="VD" data-i18n="cVD"></option><option value="GE" data-i18n="cGE"></option></select>
          </div>
          <label for="nature" data-i18n="lbNature"></label>
          <select id="nature"><option value="pec" data-i18n="natPec"></option><option value="nonpec" data-i18n="natNonpec"></option></select>
          <label for="inst" data-i18n="lbInst"></label>
          <select id="inst">
            <option value="concil" data-i18n="iConcil"></option>
            <option value="first" data-i18n="iFirst"></option>
            <option value="appel" data-i18n="iAppel"></option>
            <option value="recours" data-i18n="iRecours"></option>
            <option value="rev" data-i18n="iRev"></option>
            <option value="tf" data-i18n="iTF"></option>
            <option value="arb" data-i18n="iArb"></option>
          </select>
          <div id="ptypeBox">
            <label for="ptype" data-i18n="lbPtype"></label>
            <select id="ptype"></select>
          </div>
          <div id="vdAuthBox" hidden>
            <label for="vdAuth" data-i18n="lbVdAuth"></label>
            <select id="vdAuth">
              <option value="auto" data-i18n="auAuto"></option>
              <option value="jp" data-i18n="auJP"></option>
              <option value="ta" data-i18n="auTA"></option>
              <option value="cpc" data-i18n="auCPC"></option>
              <option value="cc" data-i18n="auCC"></option>
              <option value="tb" data-i18n="auTB"></option>
            </select>
            <div class="hint" data-i18n="hintVdAuth"></div>
          </div>
          <label for="matter" data-i18n="lbMatter"></label>
          <select id="matter">
            <option value="gen" data-i18n="mGen"></option>
            <option value="trav" data-i18n="mTrav"></option>
            <option value="bailH" data-i18n="mBailH"></option>
            <option value="bailC" data-i18n="mBailC"></option>
            <option value="conso" data-i18n="mConso"></option>
            <option value="assLAMal" data-i18n="mAssLAMal"></option>
            <option value="assLAA" data-i18n="mAssLAA"></option>
            <option value="free" data-i18n="mFree"></option>
          </select>
          <div class="hint" data-i18n="hintMatter"></div>
          <label class="check" id="insuredBox" hidden><input type="checkbox" id="insured"> <span data-i18n="lbInsured"></span></label>
        </div>

<script>
// ===== Frais judiciaires et dépens / Court costs and party costs — moteur v2 =====
// id est avocats, outil d'aide au calcul. À vérifier dans chaque cas.
// SPDX-License-Identifier: AGPL-3.0-or-later
// Sources : CPC (RS 272) ; LTF (RS 173.110) ; VD TFJC (BLV 270.11.5), TDC (BLV 270.11.6), LJB (BLV 173.655), TFJDA (BLV 173.36.5.1) ;
// GE LaCC (E 1 05), RTFMC (E 1 05.10), RFPA (E 5 10.03), tarif interne du TPI ; OELP (RS 281.35) ; FITAF (RS 173.320.2) ;
// tarif et règlement sur les dépens du TF (RS 173.110.210.1 et .3).
const Frais = (() => {
  let LG = 'fr';
  const L = (fr, en) => LG === 'en' ? en : fr;
  const R = (min, max, ref, extra = {}) => Object.assign({ min, max, ref }, extra);
  const fixed = (v, ref, extra) => R(v, v, ref, extra);
  const pick = (table, vl) => table.find(r => vl <= r[0]);
  const midOf = r => r.mid !== undefined ? r.mid : (r.min + r.max) / 2;
  const mapR = (r, f, ref, extra = {}) => Object.assign({}, r, { min: f(r.min), max: f(r.max), mid: f(midOf(r)), ref: ref !== undefined ? ref : r.ref }, extra);
  const zero = ref => fixed(0, ref, { mid: 0 });
  const VAT = 0.081;
  // Ampleur de la cause : position de la valeur centrale sur une échelle logarithmique (convention de l’outil)
  const AMP = { simple: 0.1, moy: 0.3, imp: 0.55 };
  const logMid = (min, max, a) => min <= 0 ? (min + max) * (AMP[a] ?? 0.3) : Math.exp(Math.log(min) + (AMP[a] ?? 0.3) * (Math.log(max) - Math.log(min)));
  const rng = (min, max, ref, a, extra = {}) => R(min, max, ref, Object.assign({ mid: logMid(min, max, a) }, extra));

  // ---------- OELP ----------
  const OELP48 = [[1000, 40, 150], [10000, 50, 300], [100000, 60, 500], [1000000, 70, 2000], [Infinity, 500, 4000]];
  const oelp48 = vl => { const r = pick(OELP48, vl); return R(r[1], r[2], L('art. 48 al. 1 OELP', 'Art. 48 para. 1 OELP')); };
  const oelp61 = vl => { const r = pick(OELP48, vl); return R(r[1], r[2] * 1.5, L('art. 61 al. 1 OELP, au plus 1,5 fois l’émolument de première instance', 'Art. 61 para. 1 OELP, up to 1.5 times the first-instance fee')); };

  // ---------- Vaud : TFJC ----------
  const VD_CONC = [[2000, 150], [5000, 210], [10000, 300], [30000, 360], [100000, 900]];
  const vdConc = vl => { const r = pick(VD_CONC, vl); return fixed(r ? r[1] : Math.min(5000, 1200 + Math.max(0, vl - 500000) * 0.0025), L('art. 15 TFJC', 'Art. 15 TFJC')); };
  const scale = (table, vl, base, pct, cap, from = 500000) => { const r = pick(table, vl); return r ? r[1] : Math.min(cap, base + (vl - from) * pct); };
  const VD_ORD = [[30000, 3750], [100000, 7000], [250000, 9500], [500000, 11500]], VD_ORD_X = [[30000, 1875], [100000, 3500], [250000, 4750], [500000, 5750]];
  const VD_SIM = [[2000, 360], [5000, 750], [10000, 900], [30000, 2100], [100000, 5000], [250000, 7000], [500000, 8500]], VD_SIM_X = [[2000, 180], [5000, 375], [10000, 450], [30000, 1050], [100000, 2500], [250000, 3500], [500000, 4250]];
  const VD_TB_ORD = [[100000, 4000], [250000, 7500], [500000, 8000]], VD_TB_ORD_X = [[100000, 2000], [250000, 3500], [500000, 4000]];
  const VD_TB_SIM = [[2000, 300], [5000, 600], [10000, 800], [30000, 1500], [100000, 3000], [250000, 5000], [500000, 6000]], VD_TB_SIM_X = [[2000, 150], [5000, 300], [10000, 400], [30000, 750], [100000, 1500], [250000, 2500], [500000, 3000]];
  function vdDecision(kind, vl, extra, bailC) {
    if (bailC && kind === 'ord') { const v = scale(VD_TB_ORD, vl, 8000, 0.015, 150000), x = scale(VD_TB_ORD_X, vl, 4000, 0.0075, 75000); return fixed(v + extra * x, L('art. 20 TFJC (Tribunal des baux, bail commercial)', 'Art. 20 TFJC (Tenancy Court, commercial lease)')); }
    if (bailC) { const v = scale(VD_TB_SIM, vl, 6000, 0.015, 150000), x = scale(VD_TB_SIM_X, vl, 3000, 0.0075, 75000); return fixed(v + extra * x, L('art. 25 TFJC (Tribunal des baux, bail commercial)', 'Art. 25 TFJC (Tenancy Court, commercial lease)')); }
    if (kind === 'ord') { const v = scale(VD_ORD, vl, 15500, 0.015, 300000), x = scale(VD_ORD_X, vl, 7750, 0.0075, 150000); return fixed(v + extra * x, extra ? L('art. 18 et 19 TFJC', 'Art. 18 and 19 TFJC') : L('art. 18 TFJC', 'Art. 18 TFJC')); }
    const v = scale(VD_SIM, vl, 11500, 0.015, 200000), x = scale(VD_SIM_X, vl, 5750, 0.0075, 100000);
    return fixed(v + extra * x, extra ? L('art. 23 et 24 TFJC', 'Art. 23 and 24 TFJC') : L('art. 23 TFJC', 'Art. 23 TFJC'));
  }
  let AUTH = null; // autorité vaudoise choisie : jp | ta | tb | cpc | cc
  const vdAuth = (vl, bailC) => AUTH || (bailC ? 'tb' : vl <= 10000 ? 'jp' : vl <= 100000 ? 'ta' : 'cpc');
  const T28 = { jp: [150, 800], ta: [300, 1600], tb: [300, 1600], cpc: [900, 3000], cc: [900, 3000] };
  const VD_AUTH_TXT = () => ({ jp: L('juge de paix', 'justice of the peace'), ta: L('président ou tribunal d’arrondissement', 'district court or its president'), tb: L('Tribunal des baux', 'Tenancy Court'), cpc: L('Chambre patrimoniale cantonale', 'Chambre patrimoniale cantonale'), cc: L('Cour civile du Tribunal cantonal', 'Civil Court of the Cantonal Court') });
  function vdSomm(vl, bailC) {
    const a = vdAuth(vl, bailC), T = T28[a];
    return R(T[0], T[1], L(`art. 28 TFJC, ${VD_AUTH_TXT()[a]}`, `Art. 28 TFJC, ${VD_AUTH_TXT()[a]}`), { auth: a });
  }
  const vdSuper = a => ({ jp: 100, ta: 200, tb: 200, cpc: 350, cc: 350 }[a]);
  const vdAppel = vl => fixed(Math.min(50000, (vl <= 30000 ? 600 : 1000) + vl * 0.01), L('art. 62 TFJC', 'Art. 62 TFJC'));
  const vdRecours = vl => fixed(vl <= 2000 ? 100 : vl <= 5000 ? 200 : vl <= 10000 ? 400 : Math.min(20000, 300 + vl * 0.01), L('art. 69 al. 1 TFJC', 'Art. 69 para. 1 TFJC'));

  // ---------- Vaud : TDC ----------
  const TDC = {
    ord: { ref: '4', t: [[30000, 1000, 9000], [100000, 3000, 15000], [250000, 6000, 25000], [500000, 9000, 40000], [1000000, 12000, 60000], [2000000, 16000, 80000], [5000000, 20000, 100000]], top: vl => [40000, vl * 0.02] },
    simpl: { ref: '5', t: [[2000, 500, 1000], [5000, 800, 1800], [10000, 1000, 3000], [30000, 1500, 5000], [100000, 2000, 10000], [250000, 4000, 12000], [500000, 6000, 13000], [1000000, 9000, 15000]], top: vl => [12000, vl * 0.015] },
    somm: { ref: '6', t: [[2000, 100, 600], [5000, 400, 1000], [10000, 800, 2000], [30000, 1000, 3000], [100000, 1500, 6000], [250000, 3000, 8000], [500000, 4000, 9000], [1000000, 5000, 10000]], top: vl => [6000, vl * 0.01] },
    appel: { ref: '7', t: [[30000, 600, 4500], [100000, 1500, 7500], [250000, 3000, 12500], [500000, 4000, 20000], [1000000, 5000, 30000], [2000000, 6000, 40000], [5000000, 7000, 50000]], top: vl => [8000, vl * 0.01] },
    recours: { ref: '8', t: [[2000, 100, 500], [5000, 200, 800], [10000, 400, 1500], [30000, 600, 2500], [100000, 1000, 5000], [250000, 1200, 6000], [500000, 1500, 7000], [1000000, 1500, 8000]], top: () => [1500, 10000] },
  };
  // Agent d’affaires breveté (art. 10 à 14 TDC)
  const TDC_AG = {
    simpl: { ref: '10', t: [[2000, 375, 750], [5000, 600, 1350], [10000, 750, 2250], [30000, 1125, 3750], [100000, 1500, 7500], [250000, 3000, 9000], [500000, 4500, 9750], [1000000, 6750, 11250]], top: vl => [9000, vl * 0.01125] },
    somm: { ref: '11', t: [[2000, 75, 450], [5000, 300, 750], [10000, 600, 1500], [30000, 750, 2250], [100000, 1125, 4500], [250000, 2250, 6000], [500000, 3000, 6750], [1000000, 3750, 7500]], top: vl => [4500, vl * 0.0075] },
    appel: { ref: '12', t: [[30000, 450, 3375], [100000, 1125, 5625], [250000, 2250, 9375], [500000, 3000, 15000], [1000000, 3750, 22500], [2000000, 4500, 30000], [5000000, 5250, 37500]], top: vl => [6000, vl * 0.0075] },
    recours: { ref: '13', t: [[2000, 75, 375], [5000, 150, 600], [10000, 300, 1125], [30000, 450, 1875], [100000, 750, 3750], [250000, 900, 4500], [500000, 1125, 5250], [1000000, 1125, 6000]], top: () => [1125, 7500] },
  };
  // key : ord | simpl | somm | appel | recours | rev ; o : { rep, nonpec, amp, deb }
  function vdDepens(key, vl, second, hours, o = {}) {
    const ag = o.rep === 'agent';
    const deb = o.deb !== undefined ? o.deb : second ? 0.02 : 0.05;
    let min, max, refArt, mid;
    if (key === 'rev') { [min, max] = ag ? [400, 15000] : [600, 18000]; refArt = '15'; mid = logMid(min, max, o.amp); }
    else if (o.nonpec) { [min, max] = second ? (ag ? [75, 17500] : [100, 25000]) : (ag ? [400, 35000] : [600, 50000]); refArt = `${ag ? 14 : 9} al. ${second ? 2 : 1}`; mid = logMid(min, max, o.amp); }
    else {
      const d = ag ? (TDC_AG[key === 'ord' ? 'simpl' : key]) : TDC[key], r = pick(d.t, vl);
      const [a, b] = r ? [r[1], r[2]] : d.top(vl); min = a; max = Math.max(a, b); refArt = d.ref; mid = min + 0.35 * (max - min);
    }
    let how = 'pos';
    if (hours > 0) { const rate = 350 * (vl > 0 && vl <= 30000 ? 0.85 : 1) * (ag ? 0.75 : 1); mid = Math.min(max, Math.max(min, hours * rate)); how = 'hours'; }
    if (o.analog) refArt += L(', par analogie', ', by analogy');
    const p100 = Math.round(deb * 100);
    return R(min * (1 + deb), max * (1 + deb), L(`art. ${refArt} TDC, avec débours de ${p100} % selon l’art. 19 al. 2 TDC`, `Art. ${refArt.replace('al.', 'para.').replace('par analogie', 'by analogy')} TDC, plus disbursements of ${p100}% under Art. 19 para. 2 TDC`), { mid: mid * (1 + deb), how });
  }

  // ---------- Genève : RTFMC, LaCC, tarif interne du TPI ----------
  const geConc = vl => fixed(vl <= 30000 ? 100 : 200, L('art. 15 RTFMC', 'Art. 15 RTFMC'));
  const GE17 = [[10000, 200, 2000], [30000, 1000, 3000], [100000, 2000, 8000], [1000000, 5000, 30000], [10000000, 20000, 100000], [Infinity, 100000, 200000]];
  const GE_TPI = [[5000, 500], [10000, 1000], [30000, 2000], [50000, 3000], [100000, 5000], [250000, 10000], [500000, 20000], [1000000, 30000], [2000000, 40000], [4000000, 50000], [6000000, 65000], [8000000, 80000], [10000000, 100000], [20000000, 150000], [Infinity, 200000]];
  const ge17 = vl => { const r = pick(GE17, vl); return R(r[1], r[2], L('art. 17 RTFMC ; valeur centrale selon le tarif interne du TPI', 'Art. 17 RTFMC; central value from the Court of First Instance internal tariff'), { mid: pick(GE_TPI, vl)[1] }); };
  const geProvMid = vl => vl <= 100000 ? 800 : vl <= 1000000 ? 1200 : 2000;
  const ge26 = vl => R(150, 10000, L('art. 26 RTFMC', 'Art. 26 RTFMC'), { mid: geProvMid(vl) });
  const GE_PH = [[100000, 200, 2000], [300000, 1000, 3000], [1000000, 2000, 8000], [Infinity, 10000, 10000]];
  const gePH = (vl, cour) => { const r = pick(GE_PH, vl); return R(r[1], r[2], cour ? L('art. 71 RTFMC ; art. 19 al. 3 let. c LaCC', 'Art. 71 RTFMC; Art. 19 para. 3 let. c LaCC') : L('art. 69 RTFMC ; art. 19 al. 3 let. c LaCC', 'Art. 69 RTFMC; Art. 19 para. 3 let. c LaCC')); };
  function geBase(vl) {
    const T = [[5000, 0, 0.25, 0], [10000, 1250, 0.23, 5000], [20000, 2400, 0.15, 10000], [40000, 3900, 0.11, 20000], [80000, 6100, 0.09, 40000], [160000, 9700, 0.06, 80000], [300000, 14500, 0.035, 160000], [600000, 19400, 0.02, 300000], [1000000, 25400, 0.015, 600000], [4000000, 31400, 0.01, 1000000], [10000000, 61400, 0.0075, 4000000], [Infinity, 106400, 0.005, 10000000]];
    const r = pick(T, vl);
    return vl <= 5000 ? Math.max(100, vl * 0.25) : r[1] + (vl - r[3]) * r[2];
  }
  function geDepens(kind, vl) {
    const b = geBase(vl);
    if (kind === 'full') return R(b * 0.9, b * 1.1, L('art. 85 al. 1 RTFMC, barème ± 10 %', 'Art. 85 para. 1 RTFMC, scale ± 10%'), { mid: b });
    if (kind === 'somm') return R(b / 5, b * 2 / 3, L('art. 85 et 88 RTFMC, un cinquième à deux tiers du barème', 'Art. 85 and 88 RTFMC, one fifth to two thirds of the scale'), { mid: b * 2 / 3 });
    if (kind === 'lp') return R(b / 5, b * 2 / 3, L('art. 85 et 89 RTFMC, un cinquième à deux tiers du barème', 'Art. 85 and 89 RTFMC, one fifth to two thirds of the scale'), { mid: b * 2 / 3 });
    if (kind === 'nonfinal') return R(b / 5, b * 2 / 3, L('art. 85 et 87 RTFMC, un cinquième à deux tiers du barème (procédure sans jugement final)', 'Art. 85 and 87 RTFMC, one fifth to two thirds of the scale (no final judgment)'), { mid: b * 2 / 3 });

  // Affaires non pécuniaires (art. 86 RTFMC ; art. 20 al. 3 LaCC), avec les réductions des art. 87, 88 et 90 par analogie
  function geDepensNP(kind, a) {

  // ---------- Tribunal fédéral ----------
  const TF_FJ = [[10000, 200, 5000], [20000, 500, 5000], [50000, 1000, 5000], [100000, 1500, 5000], [200000, 2000, 8000], [500000, 3000, 12000], [1000000, 5000, 20000], [5000000, 7000, 40000], [10000000, 10000, 60000], [Infinity, 20000, 100000]];
  function tfFJ(vl, reduced) {
    if (reduced) return R(200, 1000, L('art. 65 al. 4 LTF', 'Art. 65 para. 4 BGG'), { mid: 600 });

  function tfDep(vl) {

  }
  function tfScenario(vl, issue, reduced, notes, np) {
    const base = np ? rng(200, 5000, L('art. 65 al. 3 let. a LTF (affaire non pécuniaire)', 'Art. 65 para. 3 let. a BGG (non-pecuniary case)'), np.amp) : tfFJ(vl, reduced);
    const avance = R(base.min, base.max, L('art. 62 al. 1 LTF, frais présumés', 'Art. 62 para. 1 BGG, expected costs'), { mid: midOf(base) });
    let fj = base, dep = np ? rng(600, 18000, L('art. 6 du règlement sur les dépens devant le TF (RS 173.110.210.3), TVA comprise (art. 12)', 'Art. 6 of the Federal Supreme Court party costs regulation (SR 173.110.210.3), VAT included (Art. 12)'), np.amp) : tfDep(vl);
    if (issue === 'art108') { fj = R(200, 500, L('art. 108 LTF, irrecevabilité manifeste (pratique : 200 à 500 francs)', 'Art. 108 BGG, manifest inadmissibility (practice: CHF 200 to 500)'), { mid: 400 }); dep = zero(L('aucun dépens, la partie adverse n’ayant pas été invitée à répondre', 'no party costs, the opposing party not having been invited to respond')); notes.push('tf108'); }

  }

  // ---------- TAF, marchés publics cantonaux ----------
  const TAF_FJ = [[10000, 200, 5000], [20000, 500, 5000], [50000, 1000, 5000], [100000, 1500, 7000], [200000, 2000, 10000], [500000, 3000, 14000], [1000000, 5000, 20000], [5000000, 7000, 40000], [Infinity, 15000, 50000]];
  const tafFJ = vl => { const r = pick(TAF_FJ, vl); return R(r[1], r[2], L('art. 4 FITAF', 'Art. 4 FITAF')); };
  const VD_MPU = [[250000, 1500, 2500], [500000, 2500, 5000], [1000000, 5000, 10000], [10000000, 10000, 15000], [30000000, 15000, 20000], [Infinity, 20000, 30000]];
  const vatOn = (dep, on) => on ? mapR(dep, x => x * (1 + VAT), dep.ref + L(', TVA de 8,1 % en sus', ', plus 8.1% VAT')) : dep;

  function computeMP(p) {
    LG = p.lang === 'en' ? 'en' : 'fr';
    const vl = p.vl, notes = [];

    const authOnly = p.mpParty === 'authOnly';
    if (p.auth === 'vd') {

      else if (p.auth === 'taf') { const h = Math.max(0, p.hours || 0); gain = R(h * 200, h * 400, L(`art. 10 al. 2 FITAF, ${h} heures à 200–400 francs`, `Art. 10 para. 2 FITAF, ${h} hours at CHF 200–400`), { mid: h * 300 }); }

  }

  // ---------- Procédure civile ----------
  // p : { lang, canton, stage, first, matter, nature, amp, vl, reconv, extra, foreign, issue, superprov, tfIssue, hours, evidence, abroad, oppRep, insured }
  const SPECIAL = ['incRecus', 'incInterv', 'incSuretes', 'incSusp', 'incDec', 'incOrd', 'incRestit', 'irrecAvance', 'exec', 'provAppel', 'appelInc', 'recoursInc', 'recoursOrd', 'retard', 'revision', 'interp', 'arbNom', 'arbConcours', 'arbRecours', 'arbDepot'];
  const FR_FRAC = f => f === 0.75 ? 'des trois quarts' : f === 0.5 ? 'de moitié' : f === 2 / 3 ? 'des deux tiers' : f === 1 / 3 ? 'd’un tiers' : 'd’un cinquième';
  const EN_FRAC = f => f === 0.75 ? 'three quarters' : f === 0.5 ? 'half' : f === 2 / 3 ? 'two thirds' : f === 1 / 3 ? 'one third' : 'one fifth';
  const VD_ISSUE = {
    concil: { endEarly: [1 / 3, 'art. 17 al. 1'] },
    ord: { endEarly: [3 / 4, 'art. 22 al. 1'], endLate: [1 / 3, 'art. 22 al. 2'], irrecEarly: [2 / 3, 'art. 22 al. 3'], irrecLate: [1 / 3, 'art. 22 al. 3'], renDeb: [1 / 2, 'art. 22 al. 6'], noMot: [1 / 5, 'art. 22 al. 7'] },
    simpl: { endEarly: [3 / 4, 'art. 27 al. 1'], endLate: [1 / 3, 'art. 27 al. 2'], irrecEarly: [2 / 3, 'art. 27 al. 3'], irrecLate: [1 / 3, 'art. 27 al. 3'], noMot: [1 / 5, 'art. 27 al. 6'] },
    somm: { endEarly: [3 / 4, 'art. 29 al. 1'], endLate: [1 / 2, 'art. 29 al. 1'], irrecEarly: [2 / 3, 'art. 29 al. 2'], irrecLate: [1 / 3, 'art. 29 al. 2'], noMot: [1 / 5, 'art. 29 al. 4'] },
    provAppel: { endEarly: [3 / 4, 'art. 79 et 29 al. 1'], endLate: [1 / 2, 'art. 79 et 29 al. 1'], noMot: [1 / 5, 'art. 79 et 29 al. 4'] },
    appel: { endEarly: [2 / 3, 'art. 67 al. 1'], endLate: [1 / 3, 'art. 67 al. 2'], noMot: [1 / 3, 'art. 67 al. 4'] },
    recours: { endEarly: [2 / 3, 'art. 76 al. 1'], endLate: [1 / 3, 'art. 76 al. 2'], noMot: [1 / 3, 'art. 76 al. 6'] },
  };
  // Réduction de l’émolument selon l’issue (VD : TFJC ; GE : art. 7 et 8 RTFMC)
  function issueReduce(fj, key, iss, VD, notes) {
    if (!iss || iss === 'jug' || !(fj.max > 0)) return fj;
    if (VD) {
      const e = key && (VD_ISSUE[key] || {})[iss];
      if (!e) { notes.push('issueNA'); return fj; }
      const [frac, art] = e;
      notes.push('issueVD');
      return mapR(fj, x => x * (1 - frac), fj.ref + L(` ; réduit ${FR_FRAC(frac)} (${art} TFJC)`, `; reduced by ${EN_FRAC(frac)} (${art.replace(/art\./g, 'Art.').replace(/al\./g, 'para.').replace(' et ', ' and ')} TFJC)`));
    }
    if (['endEarly', 'endLate', 'irrecEarly', 'irrecLate'].includes(iss)) {
      const lo = fj.min > 1000 ? Math.max(fj.min / 4, 1000) : fj.min;
      notes.push('issueGE');
      return R(lo, fj.min, fj.ref + L(' ; émolument minimal réduit jusqu’aux trois quarts, en principe pas en deçà de 1’000 francs (art. 7 al. 1 RTFMC)', '; minimum fee reduced by up to three quarters, in principle not below CHF 1,000 (Art. 7 para. 1 RTFMC)'), { mid: (lo + fj.min) / 2 });
    }
    notes.push(iss === 'noMot' ? 'issueGEnoMot' : 'issueNA');
    return fj;
  }
  // Représentation de la partie adverse, débours genevois, TVA
  function finalizeDep(dep, p, VD, notes, ctx = {}) {
    const rp = p.oppRep || 'avocat';
    if (dep.max > 0 && rp === 'none') { notes.push(VD ? 'noRepVD' : 'noRepGE'); return zero(VD ? L('art. 24 TDC : débours et, le cas échéant, indemnité équitable (art. 95 al. 3 let. a et c CPC)', 'Art. 24 TDC: disbursements and, where justified, fair compensation (Art. 95 para. 3 let. a and c CPC)') : L('art. 24 LaCC : indemnité équitable, le cas échéant (art. 95 al. 3 let. c CPC)', 'Art. 24 LaCC: fair compensation where justified (Art. 95 para. 3 let. c CPC)')); }
    if (dep.max > 0 && rp === 'stagiaire') {
      if (VD) { dep = mapR(dep, x => x * 0.75, dep.ref + L(' ; réduit d’un quart (avocat stagiaire, art. 21 TDC)', '; reduced by one quarter (trainee lawyer, Art. 21 TDC)')); notes.push('stagVD'); }
      else notes.push('stagGE');

    if (!VD && dep.max > 0) dep = mapR(dep, x => x * 1.03, dep.ref + L(' ; débours de 3 % (art. 25 LaCC)', '; disbursements of 3% (Art. 25 LaCC)'));

        // GE : TVA sur le défraiement (ACJC/1540/2021) ; VD : TVA sur le total (CACI 25.11.2025)
        const f = VD ? (x => x * (1 + VAT)) : (x => x + (x / 1.03) * VAT);
        dep = mapR(dep, f, dep.ref + (VD ? L(' ; TVA de 8,1 % incluse (pratique vaudoise)', '; 8.1% VAT included (Vaud practice)') : L(' ; TVA de 8,1 % incluse (art. 26 al. 1 LaCC)', '; 8.1% VAT included (Art. 26 para. 1 LaCC)')));

  }

  function compute(p) {
    LG = p.lang === 'en' ? 'en' : 'fr';
    const notes = [], m = p.matter || 'gen', np = p.nature === 'nonpec', a = p.amp || 'moy';
    AUTH = p.canton === 'VD' && p.vdAuth && T28[p.vdAuth] ? p.vdAuth : null;
    const vl = np ? 0 : p.vl, reconv = np ? 0 : Math.max(0, p.reconv || 0), evidence = Math.max(0, p.evidence || 0);
    const st = p.stage, second = st === 'appel' || st === 'recours';
    const first = second ? p.first : null;
    const trav = m === 'trav', bailH = m === 'bailH', bailC = m === 'bailC', assLAMal = m === 'assLAMal', assLAA = m === 'assLAA';
    if (np) notes.push('nonpec');

    // Tribunal fédéral
    if (st === 'tf') {

      const s = tfScenario(vl, p.tfIssue, reduced, notes, np ? { amp: a } : null);
      if (!np) notes.push(vl < 15000 ? 'tf15' : vl < 30000 ? 'tf30' : 'tfInfo');
      if (reduced) notes.push('tfTrav');
      if (m === 'free' || m === 'conso' || bailH || bailC || assLAMal || assLAA) notes.push('tfFree');
      let dep = s.dep; const gain = s.dep;
      if (dep.max > 0 && p.oppRep === 'none') { dep = zero(L('pas de dépens pour une partie non représentée, sauf frais indispensables (art. 1 du règlement sur les dépens devant le TF)', 'no party costs for an unrepresented party, save for indispensable expenses (Art. 1 of the Federal Supreme Court party costs regulation)')); notes.push('noRepTF'); }

    }

    if (st === 'appel' && first === 'lp') return { error: 'appelLP' };
    const withReconv = (st === 'ord' || st === 'simpl') && reconv > 0;
    const vlDep = withReconv ? vl + reconv : vl;
    const VD = p.canton === 'VD';

    // 1. Émolument de base

    if (VD && np) {

      else if (st === 'ord') fj = rng(3750, 300000, L('art. 21 TFJC', 'Art. 21 TFJC'), a);
      else if (st === 'simpl') fj = rng(360, 200000, L('art. 26 TFJC', 'Art. 26 TFJC'), a);
      else if (st === 'somm' || st === 'prov') fj = rng(T28a[0], T28a[1], L(`art. 28 TFJC, ${VD_AUTH_TXT()[au]}`, `Art. 28 TFJC, ${VD_AUTH_TXT()[au]}`), a, { auth: au });
      else if (st === 'memo') fj = fixed(vdSuper(au), L(`art. 30 TFJC, ${VD_AUTH_TXT()[au]}`, `Art. 30 TFJC, ${VD_AUTH_TXT()[au]}`));
      else if (st === 'lp') fj = oelp48(0);
      else if (st === 'appel') fj = first === 'prov' ? fixed(800, L('art. 65 al. 1 TFJC', 'Art. 65 para. 1 TFJC')) : rng(800, 6000, L('art. 64 al. 1 TFJC', 'Art. 64 para. 1 TFJC'), a);
      else fj = rng(100, 20000, L('art. 72 TFJC', 'Art. 72 TFJC'), a);
      if (st === 'prov' && p.superprov) { const sp = vdSuper(fj.auth); fj = mapR(fj, x => x + sp, fj.ref + L(` ; mesures superprovisionnelles : ${sp} francs (art. 30 TFJC)`, `; ex parte measures: CHF ${sp} (Art. 30 TFJC)`)); }
      if (st === 'prov') notes.push(au === 'cpc' || au === 'cc' ? 'vdProv30' : au === 'jp' ? 'vdProvJP' : 'vdProv5');
      if (st === 'appel' && first !== 'prov') notes.push('vdNP64');
      if (['somm', 'prov', 'memo'].includes(st) && !AUTH) notes.push('vdNPauth');
    } else if (VD) {
      const vlF = withReconv ? vl + reconv : vl;
      if (st === 'concil') fj = vdConc(vl);
      else if (st === 'ord' || st === 'simpl') fj = vdDecision(st, vlF, p.extra, bailC);
      else if (st === 'somm' || st === 'prov') fj = vdSomm(vl, bailC);
      else if (st === 'memo') { const au = vdAuth(vl, bailC); fj = fixed(vdSuper(au), L(`art. 30 TFJC, ${VD_AUTH_TXT()[au]}`, `Art. 30 TFJC, ${VD_AUTH_TXT()[au]}`)); }
      else if (st === 'lp') fj = oelp48(vl);
      else if (st === 'appel') fj = first === 'prov' ? fixed(800, L('art. 65 al. 1 TFJC', 'Art. 65 para. 1 TFJC')) : vdAppel(vl);
      else fj = first === 'lp' ? oelp61(vl) : vdRecours(vl);
      if (st === 'prov' && p.superprov) { const sp = vdSuper(fj.auth); fj = R(fj.min + sp, fj.max + sp, fj.ref + L(` ; mesures superprovisionnelles : ${sp} francs (art. 30 TFJC)`, `; ex parte measures: CHF ${sp} (Art. 30 TFJC)`), { auth: fj.auth }); }
      if (st === 'prov') notes.push(fj.auth === 'cpc' || fj.auth === 'cc' ? 'vdProv30' : fj.auth === 'jp' ? 'vdProvJP' : 'vdProv5');
      if (st === 'appel' && first === 'prov') notes.push('vdAppelProv');
      if (withReconv) notes.push('reconvVD');
    } else {
      const g18 = () => rng(200, 50000, L('art. 18 RTFMC', 'Art. 18 RTFMC'), a);
      const g26 = () => np ? rng(150, 10000, L('art. 26 RTFMC', 'Art. 26 RTFMC'), a) : ge26(vl);
      if (st === 'concil') fj = np ? rng(100, 200, L('art. 16 RTFMC', 'Art. 16 RTFMC'), a) : geConc(vl);
      else if (st === 'ord' || st === 'simpl') {
        fj = np ? g18() : ge17(vl);
        if (withReconv) { const r2 = ge17(reconv); fj = R(fj.min + r2.min, fj.max + r2.max, L('art. 17 et 14 RTFMC (émolument distinct pour la demande reconventionnelle)', 'Art. 17 and 14 RTFMC (separate fee for the counterclaim)'), { mid: midOf(fj) + midOf(r2) }); notes.push('reconvGE'); }
      }
      else if (st === 'somm' || st === 'prov') fj = g26();

      else if (st === 'lp') fj = oelp48(vl);
      else if (first === 'lp') fj = oelp61(vl);
      else { const sc = first === 'ordsimpl' ? (np ? g18() : ge17(vl)) : g26(); const art = st === 'appel' ? (first === 'prov' ? 37 : 35) : (first === 'prov' ? 40 : 38); fj = R(sc.min, sc.max, L(`art. ${art} RTFMC, renvoyant à l’${sc.ref}`, `Art. ${art} RTFMC, referring to ${sc.ref}`), { mid: sc.mid }); }
      if (st === 'prov' && p.superprov) fj = mapR(fj, x => x, fj.ref + L(' ; mesures superprovisionnelles : +25 % selon le tarif interne du TPI', '; ex parte measures: +25% under the internal tariff'), { mid: midOf(fj) * 1.25 });
    }

    const zeroFJ = ref => { fj = zero(ref); };
    if (m === 'free' || assLAMal || (assLAA && !VD)) {
      if (st !== 'memo') {
        const fed = m === 'free' || assLAMal;
        zeroFJ(fed ? (st === 'concil' ? L('art. 113 al. 2 CPC', 'Art. 113 para. 2 CPC') : st === 'lp' ? L('art. 114 CPC ; art. 48 al. 3 OELP', 'Art. 114 CPC; Art. 48 para. 3 OELP') : second ? L('art. 114 CPC, applicable aussi en deuxième instance (TF 4A_332/2015)', 'Art. 114 CPC, also applicable on appeal (FSC 4A_332/2015)') : L('art. 114 CPC', 'Art. 114 CPC')) : L('art. 22 al. 3 let. a LaCC', 'Art. 22 para. 3 let. a LaCC'));
        notes.push(m === 'free' ? 'free' : 'assFree');
      }
    } else if (trav && np) {
      notes.push('nonpecTrav');
      if (!VD) notes.push('travGE');
    } else if (trav) {
      if (vl <= 30000 && st !== 'memo') { zeroFJ(st === 'concil' ? L('art. 113 al. 2 let. d CPC', 'Art. 113 para. 2 let. d CPC') : second ? L('art. 114 let. c CPC, applicable aussi en deuxième instance (TF 4A_332/2015)', 'Art. 114 let. c CPC, also applicable on appeal (FSC 4A_332/2015)') : L('art. 114 let. c CPC', 'Art. 114 let. c CPC')); notes.push('travFree'); }
      else if (VD && vl <= 100000 && ['concil', 'ord', 'appel', 'recours'].includes(st) && cantonal) {
        const art = { concil: L('art. 17 al. 2 TFJC', 'Art. 17 para. 2 TFJC'), ord: L('art. 22 al. 9 TFJC', 'Art. 22 para. 9 TFJC'), appel: L('art. 67 al. 3 TFJC', 'Art. 67 para. 3 TFJC'), recours: L('art. 76 al. 5 TFJC', 'Art. 76 para. 5 TFJC') }[st];
        fj = mapR(fj, x => x / 2, fj.ref + L(` ; réduit de moitié (travail, ${art})`, `; halved (employment, ${art})`)); notes.push('travVD');
      } else if (!VD && st !== 'concil' && st !== 'memo' && cantonal) {
        const cour = second, thr = cour ? 50000 : 75000;
        if (vl <= thr) { zeroFJ(L(`art. 19 al. 3 let. c LaCC (gratuité jusqu’à ${cour ? '50’000' : '75’000'} francs)`, `Art. 19 para. 3 let. c LaCC (free up to CHF ${cour ? '50,000' : '75,000'})`)); }
        else fj = gePH(vl, cour);
        notes.push('travGE');
      }
    } else if (bailH || bailC) {
      if (st === 'concil') { zeroFJ(L('art. 113 al. 2 let. c CPC', 'Art. 113 para. 2 let. c CPC')); notes.push('bailConc'); }
      else if (!VD && cantonal) { zeroFJ(L('art. 22 al. 1 LaCC', 'Art. 22 para. 1 LaCC')); notes.push('bailGE'); }
      else if (VD && bailH && !second && cantonal && st !== 'memo') { zeroFJ(L('art. 12 al. 1 LJB', 'Art. 12 para. 1 LJB')); notes.push('bailHVD'); }
      else if (VD && bailC && !second) notes.push('bailCVD');
      if (VD && second) notes.push('bailSecond');
    } else if (m === 'conso') {
      if (!VD && cantonal) { zeroFJ(L('art. 22 al. 5 LaCC', 'Art. 22 para. 5 LaCC')); notes.push('consoGE'); }
      else notes.push('consoVD');
    }
    if (assLAA && VD) notes.push('assLAAVD');

    // 4. Avance (art. 98 CPC)
    const half = st === 'ord' || st === 'simpl' || st === 'prov';
    const avRef = half ? (st === 'prov' ? L('art. 98 al. 1 et 2 let. c CPC (mesures provisionnelles : au plus la moitié)', 'Art. 98 para. 1 and 2 let. c CPC (interim measures: up to half)') : L('art. 98 al. 1 CPC, au plus la moitié', 'Art. 98 para. 1 CPC, up to half'))
      : st === 'concil' ? L('art. 98 al. 2 let. b CPC, au plus la totalité', 'Art. 98 para. 2 let. b CPC, up to the full amount')
      : second ? L('art. 98 al. 2 let. d CPC, au plus la totalité', 'Art. 98 para. 2 let. d CPC, up to the full amount')
      : L('art. 98 al. 2 let. c CPC, au plus la totalité', 'Art. 98 para. 2 let. c CPC, up to the full amount');
    let avance = mapR(fj, x => x * (half ? 0.5 : 1), avRef);
    if (evidence) { avance = mapR(avance, x => x + evidence, avance.ref + L(' ; preuves : art. 102 CPC', '; evidence: Art. 102 CPC')); }

    // 5. Issue de la procédure
    const iss = p.issue || 'jug';
    if (cantonal) fj = issueReduce(fj, st === 'prov' ? 'somm' : st, iss, VD, notes);
    if (VD && cantonal) fj = mapR(fj, x => Math.floor(x));

    // 6. Dépens
    let dep, noVat = false;
    const insuredGE = !VD && (assLAMal || assLAA) && p.insured;
    if (st === 'concil') dep = zero(L('art. 113 al. 1 CPC', 'Art. 113 para. 1 CPC'));
    else if (st === 'memo') { dep = zero(L('en règle générale aucun dépens pour un mémoire préventif', 'as a rule no party costs for a protective brief')); notes.push('memoDep'); }
    else if (!VD && trav) dep = zero(L('art. 22 al. 2 LaCC (juridiction des prud’hommes)', 'Art. 22 para. 2 LaCC (employment courts)'));
    else if (VD && bailH && !second) { dep = R(0, 1500, L('art. 12 al. 3 LJB et art. 16 al. 1 TDC (seulement en cas de témérité), débours inclus', 'Art. 12 para. 3 LJB and Art. 16 para. 1 TDC (only for vexatious conduct), disbursements included'), { mid: 0 }); noVat = true; }
    else if (VD) {
      const key = st === 'ord' ? 'ord' : st === 'simpl' ? 'simpl' : (st === 'somm' || st === 'prov' || st === 'lp') ? 'somm' : st === 'appel' ? 'appel' : 'recours';
      dep = vdDepens(key, vlDep, second, p.hours || 0, { rep: p.oppRep, nonpec: np, amp: a });
      if (dep.how === 'hours') notes.push('vdHours');
    } else {
      const kind = (st === 'ord' || st === 'simpl') ? 'full' : (st === 'somm' || st === 'prov') ? 'somm' : st === 'lp' ? 'lp' : 'second';
      dep = np ? geDepensNP(kind, a) : geDepens(kind, vlDep);
      if (['endEarly', 'endLate', 'irrecEarly', 'irrecLate'].includes(iss) && dep.max > 0) { dep = R(dep.min / 3, dep.max, dep.ref + L(' ; peut être réduit (art. 23 al. 2 LaCC)', '; may be reduced (Art. 23 para. 2 LaCC)'), { mid: midOf(dep) * 2 / 3 }); notes.push('ge23'); }
    }
    const gain = finalizeDep(dep, Object.assign({}, p, { oppRep: 'avocat', abroad: !!p.clientAbroad }), VD, [], { noVat, ord: st === 'ord' });
    if (insuredGE) { dep = zero(L('art. 22 al. 3 LaCC : pas de dépens à la charge de l’assuré', 'Art. 22 para. 3 LaCC: no party costs payable by the insured')); notes.push('assInsured'); }
    dep = finalizeDep(dep, p, VD, notes, { noVat, ord: st === 'ord' });

    // 7. Avertissements de procédure
    if (!np) {
      if (st === 'ord' && vl <= 30000 && !bailC) notes.push('ordSmall');
      if (st === 'simpl' && vl > 30000 && !trav && !bailH && !bailC) notes.push('simplLarge');
      if (st === 'appel' && vl < 10000 && first !== 'prov') notes.push('appelSmall');
      if (st === 'concil' && vl >= 100000) notes.push('concil100k');
      if (VD && (st === 'somm' || st === 'prov' || st === 'memo') && !bailC && !AUTH) notes.push('vdAuthority');
    }
    if (p.foreign && VD) notes.push('vdForeign');
    if (evidence) notes.push('evidence');
    return finish(fj, avance, dep, notes, evidence, gain);
  }

  // ---------- Incidents, voies de recours particulières, exécution, arbitrage ----------
  function computeSpecial(p, notes) {
    const st = p.stage, VD = p.canton === 'VD', np = p.nature === 'nonpec', a = p.amp || 'moy';
    AUTH = VD && p.vdAuth && T28[p.vdAuth] ? p.vdAuth : null;
    const vl = np ? 0 : p.vl, m = p.matter || 'gen', bailC = m === 'bailC', evidence = Math.max(0, p.evidence || 0);
    const INC = ['incRecus', 'incInterv', 'incSuretes', 'incSusp', 'incDec', 'incRestit'];
    let fj, depKind, issueKey = null, avHalf = false, second = false;
    if (VD) {
      const au = np ? (AUTH || (bailC ? 'tb' : 'ta')) : vdAuth(vl, bailC);
      const T28a = T28[au];
      const recoursSc = () => np ? rng(100, 20000, L('art. 72 TFJC', 'Art. 72 TFJC'), a) : vdRecours(vl);
      if (INC.includes(st)) { fj = rng(T28a[0], T28a[1], L(`art. 51 et 28 TFJC, ${VD_AUTH_TXT()[au]}`, `Art. 51 and 28 TFJC, ${VD_AUTH_TXT()[au]}`), a); depKind = 'inc'; issueKey = 'somm'; notes.push('vdInc'); if (st === 'incInterv') notes.push('vdInterv'); }
      else if (st === 'incOrd') { fj = zero(L('pas d’émolument distinct ; frais réglés avec la décision finale (art. 104 CPC)', 'no separate fee; costs settled with the final decision (Art. 104 CPC)')); depKind = 'none'; notes.push('vdOrd'); }
      else if (st === 'irrecAvance') { fj = zero(L('art. 11 TFJC', 'Art. 11 TFJC')); depKind = 'none'; notes.push('vdIrrecAv'); }
      else if (st === 'exec') { fj = rng(150, 1800, L('art. 82 al. 1 TFJC', 'Art. 82 para. 1 TFJC'), a); depKind = 'somm'; issueKey = 'somm'; notes.push('execNote'); }
      else if (st === 'provAppel') { fj = fixed(750, L('art. 78 al. 1 TFJC', 'Art. 78 para. 1 TFJC')); depKind = 'somm2'; issueKey = 'provAppel'; avHalf = true; second = true; notes.push('vdProvAppel'); }
      else if (st === 'appelInc') { const b = np ? rng(800, 6000, L('art. 66 et 64 TFJC', 'Art. 66 and 64 TFJC'), a) : vdAppel(vl); fj = np ? b : mapR(b, x => x, L('art. 66 et 62 TFJC, sur la valeur litigieuse au fond', 'Art. 66 and 62 TFJC, on the amount in dispute on the merits')); depKind = 'appel'; issueKey = 'appel'; second = true; }
      else if (st === 'recoursInc' || st === 'recoursOrd') { const b = recoursSc(); fj = np ? b : mapR(b, x => x, L('art. 69 al. 1 TFJC, sur la valeur litigieuse au fond (art. 70 al. 2 TFJC)', 'Art. 69 para. 1 TFJC, on the amount in dispute on the merits (Art. 70 para. 2 TFJC)')); depKind = 'recours'; issueKey = 'recours'; second = true; }
      else if (st === 'retard') { fj = rng(100, 2400, L('art. 73 TFJC', 'Art. 73 TFJC'), a); depKind = 'recours'; issueKey = 'recours'; second = true; notes.push('vdRetard'); }
      else if (st === 'revision') { fj = np ? rng(800, 6000, L('art. 80 al. 1 et 64 TFJC', 'Art. 80 para. 1 and 64 TFJC'), a) : mapR(vdAppel(vl), x => x, L('art. 80 al. 1 et 62 TFJC (décision sujette à appel)', 'Art. 80 para. 1 and 62 TFJC (decision subject to appeal)')); depKind = 'rev'; second = true; notes.push('vdRevision'); }
      else if (st === 'interp') { const cap = np ? 20000 : midOf(vdRecours(vl)); fj = R(0, cap, L('art. 81 TFJC : au plus l’émolument du recours (art. 69 à 72 TFJC)', 'Art. 81 TFJC: up to the objection fee (Art. 69 to 72 TFJC)'), { noMin: true, mid: np ? logMid(100, 20000, a) : cap / 2 }); depKind = 'rev'; second = true; }
      else if (st === 'arbNom') { fj = rng(200, 1200 + 600 * Math.max(0, p.extra || 0), L('art. 84 TFJC', 'Art. 84 TFJC'), a); depKind = 'arb'; notes.push('arbAppui'); }
      else if (st === 'arbConcours') { fj = rng(100, 600, L('art. 85 TFJC', 'Art. 85 TFJC'), a); depKind = 'arb'; notes.push('vdArbConcours', 'arbAppui'); }
      else if (st === 'arbRecours') { fj = np ? rng(100, 30000, L('art. 83 al. 2 TFJC', 'Art. 83 para. 2 TFJC'), a) : fixed(vl <= 2000 ? 100 : vl <= 5000 ? 200 : vl <= 10000 ? 400 : Math.min(30000, 300 + vl * 0.01), L('art. 83 al. 1 TFJC', 'Art. 83 para. 1 TFJC')); depKind = 'recours'; second = true; notes.push('arbRecours'); }
      else if (st === 'arbDepot') { fj = rng(150, 500, L('art. 86 TFJC', 'Art. 86 TFJC'), a); depKind = 'none'; }
    } else {
      const g = (min, max, art) => rng(min, max, L(`art. ${art} RTFMC`, `Art. ${art} RTFMC`), a);
      if (st === 'incRecus') fj = g(300, 2000, 19);
      else if (st === 'incInterv') { fj = g(300, 2000, '20 al. 1'); notes.push('geInterv'); }
      else if (st === 'incSuretes') fj = g(300, 2000, 21);
      else if (st === 'incSusp') { fj = g(300, 2000, '22 al. 1'); notes.push('geSusp'); }
      else if (st === 'incDec') fj = g(300, 5000, 23);
      else if (st === 'incOrd') fj = g(300, 5000, 24);
      else if (st === 'incRestit') fj = g(300, 2000, 25);
      else if (st === 'irrecAvance') fj = g(100, 200, '2 al. 4');
      else if (st === 'exec') fj = np ? g(150, 10000, 26) : ge26(vl);
      else if (st === 'provAppel') { const b = np ? g(150, 10000, 26) : ge26(vl); fj = mapR(b, x => x, L('art. 37 et 40 RTFMC, renvoyant à l’art. 26 RTFMC', 'Art. 37 and 40 RTFMC, referring to Art. 26 RTFMC')); avHalf = true; second = true; }
      else if (st === 'appelInc') { fj = g(300, 5000, 36); second = true; }
      else if (st === 'recoursInc') { fj = g(300, 2000, 39); second = true; }
      else if (st === 'recoursOrd') { fj = g(300, 5000, 41); second = true; }
      else if (st === 'retard') { fj = g(300, 2000, 42); second = true; }
      else if (st === 'revision') { fj = g(500, 10000, 43); second = true; }
      else if (st === 'interp') { fj = g(200, 2000, '44 al. 1'); second = true; notes.push('geInterp'); }
      else if (st === 'arbNom') { fj = g(500, 5000, 47); notes.push('arbAppui'); }
      else if (st === 'arbConcours') { fj = g(500, 10000, 48); notes.push('arbAppui'); }
      else if (st === 'arbRecours') { const b = np ? rng(200, 50000, L('art. 18 RTFMC', 'Art. 18 RTFMC'), a) : ge17(vl); fj = R(b.min, b.max, L(`art. 49 et 38 RTFMC, renvoyant à l’${b.ref}`, `Art. 49 and 38 RTFMC, referring to ${b.ref}`), { mid: midOf(b) }); second = true; notes.push('arbRecours'); }
      else if (st === 'arbDepot') { fj = g(200, 500, '50 al. 1'); if (p.foreign) { fj = mapR(fj, x => x * 2, fj.ref + L(' ; doublé selon l’art. 50 al. 2 RTFMC', '; doubled under Art. 50 para. 2 RTFMC')); } }
      depKind = st === 'arbDepot' ? 'none' : ['exec', 'provAppel', 'arbNom', 'arbConcours'].includes(st) ? 'somm' : st === 'revision' || st === 'interp' ? 'rev' : st === 'arbRecours' ? 'second' : 'nonfinal';
      if (st === 'exec') notes.push('execNote');
    }
    if (st === 'arbDepot' && VD && p.foreign) notes.push('vdDepotForeign');

    // Gratuité selon la matière (procédure au fond seulement pour les incidents qui en relèvent)
    if ((m === 'free' || m === 'assLAMal' || (m === 'assLAA' && !VD) || (m === 'trav' && !np && vl <= 30000)) && fj.max > 0 && !st.startsWith('arb')) { fj = zero(L('art. 114 CPC ; gratuité de la procédure au fond', 'Art. 114 CPC; proceedings on the merits are free of charge')); notes.push('freeSpecial'); }
    else if (!VD && (m === 'bailH' || m === 'bailC') && fj.max > 0 && !st.startsWith('arb')) { fj = zero(L('art. 22 al. 1 LaCC', 'Art. 22 para. 1 LaCC')); notes.push('bailGE'); }
    else if (!VD && m === 'conso' && fj.max > 0 && !st.startsWith('arb')) { fj = zero(L('art. 22 al. 5 LaCC', 'Art. 22 para. 5 LaCC')); notes.push('consoGE'); }

    // Avance
    const avRef = avHalf ? L('art. 98 al. 2 let. c CPC (mesures provisionnelles : au plus la moitié)', 'Art. 98 para. 2 let. c CPC (interim measures: up to half)') : second ? L('art. 98 al. 2 let. d CPC, au plus la totalité', 'Art. 98 para. 2 let. d CPC, up to the full amount') : L('art. 98 CPC, au plus la totalité des frais présumés', 'Art. 98 CPC, up to the full expected costs');
    let avance = mapR(fj, x => x * (avHalf ? 0.5 : 1), avRef);
    if (evidence) avance = mapR(avance, x => x + evidence, avance.ref + L(' ; preuves : art. 102 CPC', '; evidence: Art. 102 CPC'));

    // Issue
    const iss = p.issue || 'jug';
    if (VD ? !!issueKey : true) fj = issueReduce(fj, issueKey, iss, VD, notes);
    if (VD) fj = mapR(fj, x => Math.floor(x));

    // Dépens
    let dep;
    if (depKind === 'none') dep = zero(L('pas de dépens distincts', 'no separate party costs'));
    else if (!VD && m === 'trav') dep = zero(L('art. 22 al. 2 LaCC (juridiction des prud’hommes)', 'Art. 22 para. 2 LaCC (employment courts)'));
    else if (VD) {
      const map = { inc: ['somm', 0.05, true], somm: ['somm', 0.05, false], somm2: ['somm', 0.02, true], appel: ['appel', 0.02, false], recours: ['recours', 0.02, false], rev: ['rev', 0.02, false], arb: ['somm', 0.05, false] }[depKind];
      const sec = depKind === 'appel' || depKind === 'recours' || depKind === 'rev' || depKind === 'somm2';
      dep = vdDepens(map[0], vl, sec, p.hours || 0, { rep: p.oppRep, nonpec: np && map[0] !== 'rev', amp: a, deb: map[1], analog: map[2] });
      if (depKind === 'arb') dep = mapR(dep, x => x, dep.ref + L(' ; art. 18 TDC', '; Art. 18 TDC'));
      if (dep.how === 'hours') notes.push('vdHours');
      notes.push('incDep');
    } else {
      dep = np ? geDepensNP(depKind, a) : geDepens(depKind, vl);
      notes.push('incDep');
    }
    // Valeur centrale : bas de la fourchette pour les incidents légers, milieu pour les recours particuliers genevois
    const light = INC.includes(st) || ['incOrd', 'irrecAvance', 'arbNom', 'arbConcours'].includes(st);
    if (dep.max > 0 && light) dep = Object.assign({}, dep, { mid: dep.min });
    else if (dep.max > 0 && !VD && ['appelInc', 'recoursInc', 'recoursOrd', 'retard', 'revision', 'interp'].includes(st)) dep = Object.assign({}, dep, { mid: (dep.min + dep.max) / 2 });
    const gain = finalizeDep(dep, Object.assign({}, p, { oppRep: 'avocat', abroad: !!p.clientAbroad }), VD, [], {});
    dep = finalizeDep(dep, p, VD, notes, {});
    if (VD) avance = mapR(avance, x => Math.floor(x));
    if (evidence) notes.push('evidence');
    return finish(fj, avance, dep, notes, evidence, gain);
  }

  function finish(fj, avance, dep, notes, evidence, gain) {
    const round = x => Math.round(x);
    const out = { fj, avance, dep, notes, evidence };
    out.gain = gain || dep; out.gainMid = round(midOf(out.gain));
    out.fjMid = round(midOf(fj)); out.depMid = round(midOf(dep)); out.avMid = round(midOf(avance));
    out.expoMin = round(fj.min + dep.min + evidence); out.expoMax = round(fj.max + dep.max + evidence); out.expoMid = out.fjMid + out.depMid + round(evidence);
    out.capOnly = !!fj.noMin;
    return out;
  }
  return { compute, computeMP, geBase, oelp48, SPECIAL };
})();

</script>

    principles: [
      'Les frais comprennent les frais judiciaires et les dépens (art. 95 CPC). Ils sont en règle générale mis à la charge de la partie qui succombe (art. 106 al. 1 CPC) ; le tribunal peut les répartir selon le sort de la cause ou en équité (art. 106 al. 2 et 107 CPC).',
      'Le tribunal peut exiger une avance à concurrence de la moitié des frais judiciaires présumés en première instance, et de la totalité en conciliation, en procédure sommaire (sous réserve d’exceptions) et en procédure de recours (art. 98 CPC, en vigueur depuis le 1er janvier 2025).',
      'Les frais judiciaires sont compensés avec l’avance de la partie qui en supporte la charge ; dans les autres cas, l’avance est restituée. La partie qui supporte les frais verse à l’autre les dépens alloués (art. 111 CPC).',
      'Aucun frais judiciaire n’est perçu dans certains litiges, notamment en matière d’égalité, de protection des données et de contrat de travail jusqu’à 30’000 francs (art. 113 al. 2 et 114 CPC). Aucun dépens n’est alloué en conciliation (art. 113 al. 1 CPC).',
      'Les tarifs sont cantonaux (art. 96 CPC) : TFJC et TDC à Vaud, RTFMC à Genève. Pour les décisions sommaires de poursuite, l’émolument suit l’ordonnance fédérale sur les émoluments perçus en application de la LP (art. 48 et 61 OELP).',
      'Le tribunal fixe le montant dans les limites du tarif selon la valeur litigieuse, la complexité et le travail effectué. Il peut majorer l’émolument (Vaud : jusqu’au triple, art. 6 TFJC ; Genève : jusqu’au double, art. 6 RTFMC) ou le réduire, notamment en cas de retrait ou de transaction.',
      'Le défendeur peut requérir des sûretés en garantie des dépens, notamment si le demandeur n’a pas de domicile ou de siège en Suisse (art. 99 CPC).',
      'Au Tribunal fédéral, l’émolument est fixé selon la valeur litigieuse, entre 200 et 100’000 francs en règle générale (art. 65 LTF et tarif du TF) ; l’avance correspond aux frais présumés (art. 62 LTF). Le recours en matière civile suppose une valeur litigieuse de 30’000 francs, ou 15’000 francs en droit du travail et du bail, sauf question juridique de principe (art. 74 LTF).',
      'La gratuité des art. 113 et 114 CPC vaut aussi en appel et en recours cantonaux (TF 4A_332/2015). À Genève, la juridiction des prud’hommes est gratuite jusqu’à 75’000 francs (50’000 francs en appel) et n’alloue pas de dépens ; les causes de baux et loyers et les contrats de consommation sont exemptés de frais (art. 19 et 22 LaCC).',
      'En procédure sommaire, la totalité des frais présumés peut être exigée à titre d’avance, sauf pour les mesures provisionnelles et certaines procédures de droit de la famille, limitées à la moitié (art. 98 al. 2 let. c CPC).',
      'L’émolument est réduit en cas de transaction, de retrait, d’irrecevabilité ou de décision non motivée (Vaud : art. 17, 22, 27, 29, 67 et 76 TFJC ; Genève : art. 7 et 8 RTFMC).',
      'L’assistance judiciaire dispense des avances et des frais judiciaires, mais pas du versement des dépens à la partie adverse en cas d’échec (art. 118 al. 3 CPC).',
      'Les causes non pécuniaires et celles dont la valeur ne peut être chiffrée relèvent de fourchettes appliquées selon l’importance et la difficulté de la cause (VD : art. 16, 21, 26, 64 et 72 TFJC, art. 3 et 9 TDC ; GE : art. 16, 18 et 86 RTFMC, art. 20 LaCC).',
      'Les incidents donnent lieu à un émolument propre : à Vaud selon le tarif de la procédure sommaire (art. 51 TFJC) ; à Genève de 300 à 2’000 francs pour la récusation, l’intervention, les sûretés, la suspension et la restitution, et de 300 à 5’000 francs pour les décisions incidentes et les ordonnances (art. 19 à 25 RTFMC).',
      'Les dépens dépendent aussi de la représentation de la partie qui gagne : à Vaud, réduction d’un quart pour un avocat stagiaire et barème propre à l’agent d’affaires breveté (art. 10 à 14 et 21 TDC) ; une partie sans avocat n’obtient que ses débours et, le cas échéant, une indemnité équitable (art. 95 al. 3 CPC).',
    ],
    principlesMP: [
      'Les frais et les dépens suivent en règle générale le sort de la cause : la partie qui succombe supporte les frais et verse des dépens à la partie qui obtient gain de cause (Confédération : art. 63 et 64 PA ; Tribunal fédéral : art. 66 et 68 LTF ; cantons : lois de procédure administrative).',
      'Le recourant doit en principe fournir une avance couvrant les frais présumés, faute de quoi le recours est irrecevable (art. 47 LPA-VD ; art. 86 LPA-GE ; art. 63 al. 4 PA ; art. 62 LTF).',
      'À Vaud, l’émolument dépend de la valeur du marché (art. 3 TFJDA). À Genève, il n’excède en règle générale pas 10’000 francs, et 15’000 francs dans les contestations pécuniaires (art. 2 RFPA). Au TAF et au Tribunal fédéral, il dépend de la valeur litigieuse (art. 4 FITAF ; art. 65 LTF et tarif du TF).',
      'Les dépens sont fixés selon l’importance et la difficulté de la cause : Vaud, 500 à 10’000 francs plus 5 % de débours (art. 11 TFJDA) ; Genève, 200 à 10’000 francs (art. 6 RFPA) ; TAF, selon le temps nécessaire à 200 à 400 francs l’heure (art. 10 FITAF) ; Tribunal fédéral, selon la valeur litigieuse (art. 4 du règlement sur les dépens).',
      'Les autorités n’ont en règle générale pas droit à des dépens lorsqu’elles obtiennent gain de cause (art. 68 al. 3 LTF ; art. 7 al. 3 FITAF).',
      'Le recours au Tribunal fédéral en matière de marchés publics n’est ouvert que si la valeur du marché atteint la valeur seuil de l’art. 52 al. 1 LMP et que la cause soulève une question juridique de principe (art. 83 let. f LTF) ; à défaut, seul le recours constitutionnel subsidiaire est possible (art. 113 LTF).',

    hintAbroad: 'Party costs reimburse the lawyer’s fees of the successful party. In Geneva they include VAT (Art. 26 para. 1 LaCC); in Vaud the courts add it as well (hourly rate “plus VAT”). The only exception in case law is a party domiciled abroad, whose lawyer charges no Swiss VAT (Court of Justice, 5 January 2026, C/8378/2025).',
    hPrinciples: 'Legal principles',
    principles: [
      'Costs consist of court fees and party costs (Art. 95 CPC). As a rule they are borne by the unsuccessful party (Art. 106 para. 1 CPC); the court may apportion them according to the outcome or on equitable grounds (Art. 106 para. 2 and 107 CPC).',
      'The court may require an advance of up to half of the expected court fees at first instance, and of the full amount in conciliation, in summary proceedings (subject to exceptions) and in appellate proceedings (Art. 98 CPC, in force since 1 January 2025).',
      'Court fees are set off against the advance of the party that bears them; otherwise the advance is refunded. The party bearing the costs pays the other party the party costs awarded (Art. 111 CPC).',
      'No court fees are charged in certain disputes, including gender equality, data protection and employment disputes up to CHF 30,000 (Art. 113 para. 2 and 114 CPC). No party costs are awarded in conciliation (Art. 113 para. 1 CPC).',
      'Tariffs are set by the cantons (Art. 96 CPC): TFJC and TDC in Vaud, RTFMC in Geneva. For summary debt enforcement decisions, the fee follows the federal DEBA Fees Ordinance (Art. 48 and 61 OELP).',
      'The court sets the amount within the tariff according to the amount in dispute, complexity and the work involved. It may increase the fee (Vaud: up to three times, Art. 6 TFJC; Geneva: up to twice, Art. 6 RTFMC) or reduce it, in particular if the claim is withdrawn or settled.',

  const depLabel = (!mp && stage !== 'tf' && canton === 'VD') || (mp && auth === 'vd') ? t.rowDepVD : t.rowDepGE;
  const row = (lab, a, m, b, ref, noMin) => `<tr><td>${lab}</td><td>${noMin ? t.noMinCell : fmt(a)}</td><td>${fmt(m)}</td><td>${fmt(b)}</td><td class="ref">${ref}</td></tr>`;
  $('#rTable').innerHTML = `<thead><tr><th>${t.thItem}</th><th>${t.thMin}</th><th>${t.thMid}</th><th>${t.thMax}</th><th style="text-align:left">${t.thRef}</th></tr></thead><tbody>`
    + row(t.rowFJ, r.fj.min, r.fjMid, r.fj.max, r.fj.ref, r.fj.noMin)
    + (r.evidence ? row(t.rowEv, r.evidence, r.evidence, r.evidence, t.refEv) : '')
    + row(t.rowAv, r.avance.min, r.avMid, r.avance.max, r.avance.ref, r.avance.noMin)
    + row(depLabel, r.dep.min, r.depMid, r.dep.max, r.dep.ref)
    + `<tr class="sum"><td>${t.rowExpo}</td><td>${r.capOnly ? t.noMinCell : fmt(r.expoMin)}</td><td>${fmt(r.expoMid)}</td><td>${fmt(r.expoMax)}</td><td></td></tr>`
    + `<tr class="sum"><td>${t.rowGain}</td><td>${fmt(r.gain.min)}</td><td>${fmt(r.gainMid)}</td><td>${fmt(r.gain.max)}</td><td class="ref">${r.gain.ref}</td></tr></tbody>`;

  const cantonName = $('#canton').selectedOptions[0].textContent;
  const amt = (rg, mid) => rg.max === 0 ? t.none : rg.min === rg.max ? `CHF ${fmt(rg.min)}` : t.amtMid(fmt(mid), rg.noMin ? null : fmt(rg.min), fmt(rg.max));
  const matterTxt = mp ? '' : (p.matter !== 'gen' ? ' – ' + $('#matter').selectedOptions[0].textContent : '');
  const issueTxt = !$('#issueBox').hidden && p.issue !== 'jug' ? ' – ' + $('#issue').selectedOptions[0].textContent : '';
  const lc = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : '';
  const instTxt = $('#inst').selectedOptions[0].textContent, ptTxt = $('#ptypeBox').hidden ? '' : $('#ptype').selectedOptions[0].textContent;
  const stageDesc = $('#inst').value === 'first' ? lc(ptTxt) : lc(instTxt) + (ptTxt ? ', ' + lc(ptTxt) : '');
  const authTxt = !$('#vdAuthBox').hidden && $('#vdAuth').value !== 'auto' ? ' – ' + $('#vdAuth').selectedOptions[0].textContent : '';
  const head = (mp ? t.sumTitleMP(t.authTxt[auth], fmt(vl)) : stage === 'tf' ? (np ? t.sumTitleTFNP : t.sumTitleTF(fmt(vl))) : np ? t.sumTitleNP(cantonName, stageDesc) : t.sumTitle(cantonName, stageDesc, fmt(vl))) + authTxt + matterTxt + issueTxt;
  $('#txtSum').value = [
    head,
    '',
    t.sumFJ(amt(r.fj, r.fjMid), r.fj.ref),
    ...(r.evidence ? [t.sumEv(fmt(r.evidence))] : []),
    t.sumAv(amt(r.avance, r.avMid), r.avance.ref),
    t.sumDep(amt(r.dep, r.depMid), r.dep.ref),
    r.capOnly ? t.sumExpoCap(fmt(r.expoMid), fmt(r.expoMax)) : t.sumExpo(fmt(r.expoMin), fmt(r.expoMax), fmt(r.expoMid)),
    t.sumGain(amt(r.gain, r.gainMid), r.gain.ref),
    ...(own ? [t.sumOwn(fmt(own))] : []),
    ...(own || pos ? [t.sumFailTot(fmt(failTotal), [...$('#failLines').querySelectorAll('li:not(.tot):not(.info):not(.sub)')].map(x => lc(x.children[0].textContent) + t.sep + x.children[1].textContent).join(' ; ')),
      t.sumWinTot(money(winTotal), [...$('#winLines').querySelectorAll('li:not(.tot):not(.info):not(.sub)')].map(x => lc(x.children[0].textContent) + t.sep + x.children[1].textContent).join(' ; '))] : []),
    ...(rcDem ? [t.noteFailDemR] : []), ...(rcDef ? [t.noteWinDefR] : []),
    ...(path && path.rows.length > 1 ? ['', t.sumPathHead, ...path.rows.map(x => t.sumPathRow(x.label, fmt(x.fj), fmt(x.dep), fmt(x.gain))), t.sumPathTot(fmt(path.tot.expo), fmt(path.tot.expoMin), fmt(path.tot.expoMax), fmt(path.tot.gain))] : []),
    '',
    (t.notIncl(evShown, vatShown, !!own) + ' ' + t.sumEnd).trim(),
  ].join('\n');
  $('#txtSum').rows = $('#txtSum').value.split('\n').length + 3;
  $('#rDetails').hidden = false;
}

// ---------- Événements ----------
['#domain', '#auth', '#hours', '#canton', '#inst', '#ptype', '#vdAuth', '#clientAbroad', '#position', '#ownFees', '#pathOn', '#pConcil', '#pInc', '#pIncType', '#pIncN', '#pFirst', '#pFirstType', '#pSecond', '#pSecondType', '#pTF', '#pTfIssue', '#matter', '#vl', '#reconv', '#extra', '#foreign', '#issue', '#tfIssue', '#mpParty', '#vat', '#abroad', '#hoursCiv', '#evidence', '#nature', '#amp', '#oppRep', '#insured'].forEach(s => { $(s).addEventListener('input', update); $(s).addEventListener('change', update); });
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  const ta = document.getElementById(b.dataset.copy);
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); try { document.execCommand('copy'); } catch (_) {} }
  b.textContent = T().copied; setTimeout(() => { b.textContent = T().copy; }, 1500);
}));
$('#print').addEventListener('click', () => window.print());
$('#reset').addEventListener('click', () => { $('#domain').value = 'civil'; $('#auth').value = 'vd'; $('#hours').value = 20; $('#canton').value = 'VD'; $('#inst').value = 'first'; ptypeKey = null; renderPtypes(); $('#ptype').value = 'ord'; $('#vdAuth').value = 'auto'; $('#clientAbroad').checked = false; $('#position').value = ''; $('#ownFees').value = ''; $('#pathOn').checked = false; ['#pConcil', '#pInc', '#pFirst', '#pSecond', '#pTF'].forEach(s => { $(s).checked = false; $(s).disabled = false; }); $('#pIncN').value = 1; $('#pFirstType').value = 'ord'; $('#pSecondType').value = 'appel'; $('#pTfIssue').value = 'fond'; $('#matter').value = 'gen'; $('#vl').value = ''; $('#reconv').value = ''; $('#extra').value = 0; $('#foreign').checked = false; $('#issue').value = 'jug'; $('#tfIssue').value = 'fond'; $('#mpParty').value = 'bidder'; $('#vat').checked = false; $('#abroad').checked = false; $('#nature').value = 'pec'; $('#amp').value = 'moy'; $('#oppRep').value = 'avocat'; $('#insured').checked = false; $('#hoursCiv').value = ''; $('#evidence').value = ''; update(); });
document.querySelectorAll('[data-lang-set]').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.langSet; store.set('lang', LANG); applyLang(); }));

function applyTheme(th) {
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === (th || 'auto'))));
}
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { const th = b.dataset.themeSet; store.set('theme', th); applyTheme(th); }));
applyTheme(store.get('theme', 'auto'));

// Lien vers le code source (art. 13 AGPL), lorsque l’outil est servi par GitHub Pages
function setSource() {
  const h = location.hostname;
  if (/\.github\.io$/.test(h)) {
    const user = h.split('.')[0], repo = location.pathname.split('/').filter(Boolean)[0];
    const url = `https://github.com/${user}${repo ? '/' + repo : ''}`;
    $('#srcLink').innerHTML = `${T().source} <a href="${url}">${url.replace('https://', '')}</a>`;
  } else $('#srcLink').hidden = true;
}

// ---------- Démarrage ----------
$('#inst').value = 'first';
const qs = new URLSearchParams(location.search);
if (qs.get('lang') === 'en' || qs.get('lang') === 'fr') { LANG = qs.get('lang'); store.set('lang', LANG); }
applyLang();
})();
</script>
